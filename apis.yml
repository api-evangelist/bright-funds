aid: bright-funds
name: Bright Funds
description: >-
  Bright Funds is a workplace-giving, corporate grants, and employee volunteering platform (now
  part of Submittable) that lets employers run donation, matching-gift, and volunteering programs
  for their employees and route funds to vetted nonprofits. The platform operates a live OpenID
  Connect / OAuth 2.0 authorization server at www.brightfunds.org for single sign-on and API
  integrations (authorization_code, client_credentials, and refresh_token grants; RS256 id_tokens;
  openid/profile/email/write/update scopes). It publishes a PGP-signed security.txt but no
  standalone developer portal or OpenAPI specification. Surfaced as a portfolio company of
  Bloomberg Beta and enriched into the API Evangelist network from its public identity and
  well-known discovery surface.
